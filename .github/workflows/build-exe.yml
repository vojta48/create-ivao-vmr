name: Build portable exe

# Builds on every pull request, on main and on v* tags (a push to a feature branch with an open PR
# would otherwise build twice). On a v* tag the exe is also attached to the GitHub release.
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Standard library only: rule generation (script and GUI give the same VMR), VMR import/export, server checks.
      - name: Run the tests
        run: python -m unittest discover -s tests -v

      - name: Install PyInstaller and pywebview
        run: pip install pyinstaller pywebview

      - name: Work out the version
        id: version
        shell: bash
        run: |
          # A v1.2.3 tag becomes product version 1.2.3; any other build is 0.0.0 (a development build).
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build IVAO_VMR_Generator.exe
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: pyinstaller build_exe.spec

      # In self-test mode the server stops by itself after IVAO_VMR_GUI_SELFTEST_SECONDS. The exe is never
      # killed: a one-file exe runs as a launcher plus the real program, and killing the launcher would leave
      # the program running. Self-test mode never checks GitHub for updates. IVAO_VMR_GUI_DATA_DIR keeps the
      # settings and the log out of the runner's AppData, in a folder the step can read afterwards.
      - name: Smoke test the exe (server)
        shell: pwsh
        env:
          IVAO_VMR_GUI_SELFTEST: "1"
          IVAO_VMR_GUI_SELFTEST_SECONDS: "20"
          IVAO_VMR_GUI_DATA_DIR: ${{ runner.temp }}\vmr-gui-server
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $p = Start-Process -FilePath dist\IVAO_VMR_Generator.exe -ArgumentList "--no-browser","--port","8765" -PassThru
          Start-Sleep -Seconds 8
          $state = Invoke-RestMethod http://127.0.0.1:8765/api/state
          if ($state.presets.Count -lt 1) { throw "no presets bundled" }
          if ($state.version -ne $env:EXPECTED_VERSION) { throw "version $($state.version) instead of $env:EXPECTED_VERSION" }
          if ($state.dataDir -ne $env:IVAO_VMR_GUI_DATA_DIR) { throw "data folder $($state.dataDir) instead of $env:IVAO_VMR_GUI_DATA_DIR" }
          $html = Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing
          if ($html.StatusCode -ne 200) { throw "GUI page not served" }
          $info = (Get-Item dist\IVAO_VMR_Generator.exe).VersionInfo
          Write-Host "OK: $($state.presets.Count) presets, GUI served, version $($state.version), product $($info.ProductName) $($info.ProductVersion)"
          $p.WaitForExit(60000) | Out-Null
          if (-not $p.HasExited) { throw "the server did not stop by itself" }
          if ($p.ExitCode -ne 0) { throw "the server self-test ended with exit code $($p.ExitCode)" }
          Write-Host "OK: the server stopped by itself"

      # Opens the real application window (WebView2) and closes it again after a few seconds.
      # Fails when pywebview or its WebView2 files did not make it into the exe.
      - name: Smoke test the exe (window)
        shell: pwsh
        env:
          IVAO_VMR_GUI_SELFTEST: "1"
          IVAO_VMR_GUI_DATA_DIR: ${{ runner.temp }}\vmr-gui-window
        run: |
          $log = Join-Path $env:IVAO_VMR_GUI_DATA_DIR "vmr_gui.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath dist\IVAO_VMR_Generator.exe -ArgumentList "--port","8766" -PassThru
          $p.WaitForExit(60000) | Out-Null
          Write-Host "--- vmr_gui.log ---"
          if (Test-Path $log) { Get-Content $log }
          Write-Host "-------------------"
          if (-not $p.HasExited) {
            Get-Process IVAO_VMR_Generator -ErrorAction SilentlyContinue | Stop-Process -Force
            throw "the window did not close by itself"
          }
          if ($p.ExitCode -ne 0) { throw "the window self-test failed with exit code $($p.ExitCode)" }
          Write-Host "OK: the application window opened and closed"

      - name: Upload the exe as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: IVAO_VMR_Generator
          path: dist/IVAO_VMR_Generator.exe

      # The licenses of what the exe contains (Python, pywebview, WebView2, ...), read from the packages
      # that were just bundled. Fails when a license text is missing.
      - name: Collect the licenses
        run: |
          python tools/collect_licenses.py licenses/THIRD-PARTY-LICENSES.txt
          Copy-Item LICENSE, NOTICE licenses/

      - name: Upload the licenses as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: licenses
          path: licenses/

  # Attach the exe to the GitHub release of the tag.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download the exe
        uses: actions/download-artifact@v4
        with:
          name: IVAO_VMR_Generator
          path: release

      # LICENSE, NOTICE and THIRD-PARTY-LICENSES.txt go with every copy of the exe (Apache 2.0 and the
      # BSD/MIT licenses of the bundled software require it).
      - name: Download the licenses
        uses: actions/download-artifact@v4
        with:
          name: licenses
          path: release

      - name: Attach exe and licenses to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/IVAO_VMR_Generator.exe
            release/LICENSE
            release/NOTICE
            release/THIRD-PARTY-LICENSES.txt
